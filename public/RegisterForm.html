<!DOCTYPE html>
<html><body>
  <h2>Inventory Registration</h2>
  <form action="/register" method="post" enctype="multipart/form-data">
    <label for="inventory_name">Name:</label><br>
    <input type="text" id="inventory_name" name="inventory_name" required><br>
    <label for="description">Description:</label><br>
    <textarea id="description" name="description"></textarea><br>
    <label for="photo">Photo:</label><br>
    <input type="file" id="photo" name="photo" accept="image/jpeg, image/png"><br><br>
    <input type="submit" value="Register">
  </form>
</body></html>
